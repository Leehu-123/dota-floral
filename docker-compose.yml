services:
  postgres:
    image: postgres:16-alpine
    container_name: dota-floral-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dota
      POSTGRES_PASSWORD: dota_secret
      POSTGRES_DB: dota_floral
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
