services:
  postgres:
    image: postgres:16-alpine
    container_name: dota-floral-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dota}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dota_secret}
      POSTGRES_DB: ${DB_NAME:-dota_floral}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dota} -d ${DB_NAME:-dota_floral}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dota-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dota-floral-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-dota}:${DB_PASSWORD:-dota_secret}@postgres:5432/${DB_NAME:-dota_floral}?schema=public"
      NEXTAUTH_URL: "${APP_URL:-https://dotafloral.vn}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NODE_ENV: "production"
    networks:
      - dota-network

  caddy:
    image: caddy:2-alpine
    container_name: dota-floral-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - dota-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  dota-network:
    driver: bridge
